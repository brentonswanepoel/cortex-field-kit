name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, schema, and links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Check catalogue content for customer information
        run: npm run check:customer-info

      - name: Build site and validate content schemas
        run: npm run build

      - name: Check internal links
        run: npm run check:links

      - name: Re-check published HTML for customer information
        run: npm run check:customer-info
